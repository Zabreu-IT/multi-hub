<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><title>Reserva</title></head><body class="p-6"><main class="max-w-xl mx-auto glass p-6 rounded-2xl"><a href="index.html">← Inicio</a><h1 class="text-3xl my-5">Completa tu reserva</h1><form id="f" class="grid gap-3"><input name="customer_name" placeholder="Nombre completo" required><input name="customer_email" type="email" placeholder="Email" required><input name="date_from" type="date"><input name="quantity" type="number" value="1" min="1"><button>Confirmar reserva</button></form><p id="message" class="mt-4"></p></main><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f)),p=await (await fetch('/api/v1/products/'+new URLSearchParams(location.search).get('id'))).json();d.product_id=p.id;d.quantity=+d.quantity;d.total_amount=+(p.base_price*d.quantity);d.currency=p.currency;d.metadata={};if(!d.date_from)delete d.date_from;let r=await fetch('/api/v1/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});message.textContent=r.ok?'Reserva creada. Recibirás la confirmación por email.':(await r.json()).detail}</script></body></html>
