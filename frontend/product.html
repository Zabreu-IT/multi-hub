<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><title>Experiencia</title></head><body class="p-6"><main id="app" class="max-w-4xl mx-auto"></main><script src="hub_engine.js"></script><script>(async()=>{let id=new URLSearchParams(location.search).get('id'),r=await fetch(api+'/products/'+id),p=await r.json();app.innerHTML=`<a href="results.html">← Resultados</a><img class="w-full h-80 object-cover rounded-2xl mt-5" src="${p.images[0]||'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1000'}" alt=""><section class="glass p-6 rounded-2xl mt-5"><h1 class="text-3xl font-bold">${esc(p.name)}</h1><p class="my-4 text-slate-300">${esc(p.description||p.description_short||'Una experiencia para recordar.')}</p><b class="text-2xl">${p.currency} ${p.base_price}</b><a class="block mt-5"><button onclick="location='checkout.html?id=${p.id}'">Reservar</button></a></section>`})()</script></body></html>
