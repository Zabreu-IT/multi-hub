services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multihub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: "multihub-mvp-2026"
    volumes:
      - "./core/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"
      - "pgdata:/var/lib/postgresql/data"
    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=2MB
        -c maintenance_work_mem=16MB
        -c max_connections=20
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d multihub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:multihub-mvp-2026@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      ADMIN_TOKEN: "mvp-admin-token"
    volumes:
      - "uploads:/app/uploads"
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:multihub-mvp-2026@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  uploads:
