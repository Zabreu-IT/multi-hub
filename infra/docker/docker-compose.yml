services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multihub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hub}"
    volumes: ["../../core/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro", "postgres_data:/var/lib/postgresql/data"]
  redis: { image: redis:7-alpine }
  api:
    build: { context: ../.., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:${POSTGRES_PASSWORD:-hub}@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes: ["../../uploads:/app/uploads"]
    depends_on: [db, redis]
  worker:
    build: { context: ../.., dockerfile: worker/Dockerfile }
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:${POSTGRES_PASSWORD:-hub}@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [db, redis]
  nginx:
    image: nginx:alpine
    ports: ["${PORT:-8080}:80"]
    volumes: ["./nginx/hub.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
volumes: { postgres_data: {} }
