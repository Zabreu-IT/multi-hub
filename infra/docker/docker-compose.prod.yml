services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multihub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hub}"
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    volumes:
      - "../../core/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"
      - "postgres_data:/var/lib/postgresql/data"
    command: >
      postgres
        -c shared_buffers=64MB
        -c effective_cache_size=128MB
        -c work_mem=2MB
        -c maintenance_work_mem=16MB
        -c max_connections=20
        -c fsync=off
        -c full_page_writes=off
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d multihub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:${POSTGRES_PASSWORD:-hub}@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      ADMIN_TOKEN: "${ADMIN_TOKEN:-multihub-admin-token}"
      API_KEY: "${API_KEY:-}"
    volumes:
      - "../../uploads:/app/uploads"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://hub:${POSTGRES_PASSWORD:-hub}@db:5432/multihub"
      CELERY_BROKER_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}"
      SMTP_HOST: "${SMTP_HOST:-smtp.zoho.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-info@ingeniartecr.com}"
      SMTP_PASS: "${SMTP_PASS:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data: {}
