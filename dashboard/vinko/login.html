<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingreso — VINKO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--bg); }
  .login-card { width: min(400px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 2.2rem 2rem; box-shadow: var(--shadow-hover); }
  .login-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--grad); display: grid; place-items: center; color: #fff; margin: 0 auto 1rem; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; }
  .login-card h1 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: .2rem; }
  .login-card .sub { text-align: center; color: var(--text-3); font-size: .85rem; margin-bottom: 1.6rem; }
  .login-card .field { margin-bottom: 1rem; }
  .login-err { color: var(--red); font-size: .85rem; min-height: 1.2rem; margin-top: .6rem; text-align: center; }
  .login-demo { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px dashed var(--border-2); font-size: .78rem; color: var(--text-3); text-align: center; }
  .login-demo code { background: var(--surface-2); padding: .1rem .4rem; border-radius: 6px; font-size: .75rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">V</div>
  <h1>VINKO</h1>
  <p class="sub">Plataforma de experiencias locales</p>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="demo_organizer@vinko.test" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="btn">Ingresar</button>
    <div class="login-err" id="err" role="alert"></div>
  </form>
  <div class="login-demo">
    Demo:<br>
    <code>demo_organizer@vinko.test</code> / <code>demo-org-2026</code> (emprendedor)<br>
    <code>demo_owner@vinko.test</code> / <code>demo-owner-2026</code> (local)<br>
    <code>demo_client@vinko.test</code> / <code>demo-client-2026</code> (cliente)
  </div>
</div>
<script>
'use strict';
(function () {
  const TOKEN_KEY = 'vinko_token', USER_KEY = 'vinko_user';
  if (localStorage.getItem(TOKEN_KEY)) { location.href = 'home.html'; return; }
  const form = document.getElementById('login-form');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Ingresando…';
    try {
      const r = await fetch('/api/v1/auth/vinko-login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || 'Error');
      localStorage.setItem(TOKEN_KEY, d.token);
      localStorage.setItem(USER_KEY, JSON.stringify(d.user));
      location.href = 'home.html';
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  });
})();
</script>
</body>
</html>
