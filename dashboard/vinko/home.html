<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VINKO — Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--bg); }
  .vinko-nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
  .vinko-brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--accent); }
  .vinko-user { display: flex; align-items: center; gap: .8rem; font-size: .85rem; color: var(--text-2); }
  .vinko-user .role-badge { background: var(--accent-soft); color: var(--accent); padding: .2rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .vinko-main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
  .vinko-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .vinko-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.4rem; }
  .vinko-card .num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--text-1); }
  .vinko-card .lbl { font-size: .8rem; color: var(--text-3); margin-top: .2rem; }
  .vinko-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
  .vinko-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.4rem; }
  .vinko-panel h3 { font-family: var(--font-display); font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
  .vinko-panel ul { list-style: none; }
  .vinko-panel li { display: flex; justify-content: space-between; align-items: center; padding: .6rem 0; border-bottom: 1px solid var(--border-2); font-size: .85rem; gap: .5rem; }
  .vinko-panel li:last-child { border-bottom: none; }
  .vinko-panel .muted { color: var(--text-3); }
  .vinko-panel .actions { display: flex; gap: .4rem; }
  .btn-logout { background: none; border: 1px solid var(--border); color: var(--text-2); padding: .4rem .9rem; border-radius: 10px; cursor: pointer; font-size: .8rem; }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }
  .btn-mini { background: none; border: 1px solid var(--border); color: var(--text-2); padding: .2rem .6rem; border-radius: 8px; cursor: pointer; font-size: .75rem; }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .btn-mini.danger:hover { border-color: var(--red); color: var(--red); }
  .vinko-form { display: grid; gap: .7rem; margin-top: 1rem; }
  .vinko-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .vinko-form input, .vinko-form select, .vinko-form textarea { width: 100%; padding: .55rem .8rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text-1); font-size: .85rem; font-family: inherit; }
  .vinko-form label { font-size: .75rem; color: var(--text-3); font-weight: 600; }
  .vinko-form .btn { margin-top: .3rem; }
  .vinko-msg { font-size: .8rem; min-height: 1.2rem; margin-top: .5rem; }
  .vinko-msg.ok { color: var(--green); }
  .vinko-msg.err { color: var(--red); }
  .hidden { display: none; }
</style>
</head>
<body>
<nav class="vinko-nav">
  <div class="vinko-brand">VINKO</div>
  <div class="vinko-user">
    <span id="user-name">—</span>
    <span class="role-badge" id="user-role">—</span>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
</nav>
<main class="vinko-main">
  <div class="vinko-cards" id="stats"></div>
  <div class="vinko-grid" id="panels"></div>
</main>
<script>
'use strict';
const TOKEN_KEY = 'vinko_token', USER_KEY = 'vinko_user';
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch (e) { return null; } }
function logout() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); location.href = 'login.html'; }
function hdr() { return { 'Authorization': 'Bearer ' + getToken() }; }
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign(hdr(), opts.headers || {});
  const r = await fetch('/api/v1' + path, opts);
  if (r.status === 401) { logout(); throw new Error('Sesión expirada'); }
  return r.json();
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) { return '$' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2 }); }
function card(num, lbl) { return '<div class="vinko-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>'; }
function panel(title, body) { return '<div class="vinko-panel"><h3>' + title + '</h3><ul>' + body + '</ul></div>'; }

async function load() {
  const u = getUser();
  if (!u) { location.href = 'login.html'; return; }
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-role').textContent = u.role.replace('_', ' ');
  const me = await api('/users/me');
  const stats = document.getElementById('stats');
  const panels = document.getElementById('panels');

  if (u.role === 'ORGANIZER') {
    const tier = await api('/tiers/' + (me.tier_id || 1));
    const mine = await api('/experiences/mine');
    const coupons = await api('/coupons');
    stats.innerHTML = [
      card(money(me.gmv_total), 'GMV total'),
      card(tier.name, 'Tier · ' + tier.commission_rate + '% comisión'),
      card(mine.length, 'Experiencias activas'),
      card(coupons.length, 'Cupones')
    ].join('');
    panels.innerHTML = [
      panel('Mis experiencias', mine.length ? mine.map(p => '<li><span>' + esc(p.name) + ' <span class="muted">' + money(p.base_price) + '</span></span><span class="actions"><button class="btn-mini" onclick="editExp(\'' + p.id + '\')">Editar</button><button class="btn-mini danger" onclick="delExp(\'' + p.id + '\')">Archivar</button></span></li>').join('') : '<li class="muted">Sin experiencias aún</li>') + expForm(),
      panel('Mis cupones', coupons.length ? coupons.map(c => '<li><span>' + esc(c.code) + '</span><span class="muted">' + c.discount_percent + '%</span></li>').join('') : '<li class="muted">Sin cupones</li>')
    ].join('');
  } else if (u.role === 'SPACE_OWNER') {
    const spaces = await api('/spaces');
    const mine = spaces.filter(s => s.owner_id === me.id);
    stats.innerHTML = [
      card(mine.length, 'Espacios activos'),
      card(mine.reduce((a, s) => a + (s.capacity || 0), 0), 'Capacidad total'),
      card(mine.filter(s => s.is_active).length, 'Publicados')
    ].join('');
    panels.innerHTML = [
      panel('Mis espacios', mine.length ? mine.map(s => '<li><span>' + esc(s.name) + ' <span class="muted">' + money(s.price_per_hour) + '/h</span></span><span class="actions"><button class="btn-mini danger" onclick="delSpace(\'' + s.id + '\')">Desactivar</button></span></li>').join('') : '<li class="muted">Sin espacios aún</li>') + spaceForm()
    ].join('');
  } else {
    stats.innerHTML = [card('—', 'Rol cliente'), card('—', 'Explora experiencias')].join('');
    panels.innerHTML = panel('Bienvenido', '<li class="muted">Explora el catálogo de experiencias en hub.zabreuit.com</li>');
  }
}

function expForm() {
  return '<div class="vinko-form"><h3 style="font-family:var(--font-display);font-size:.95rem;font-weight:700">Nueva experiencia</h3>' +
    '<div class="row"><div><label>Nombre</label><input id="exp-name" placeholder="Taller de cerámica"></div><div><label>Slug</label><input id="exp-slug" placeholder="taller-ceramica"></div></div>' +
    '<div class="row"><div><label>Precio (USD)</label><input id="exp-price" type="number" step="0.01" min="0" placeholder="25.00"></div><div><label>Ubicación</label><select id="exp-loc"><option value="public_space">Espacio público</option><option value="private_space">Espacio privado</option></select></div></div>' +
    '<div class="row"><div><label>Latitud</label><input id="exp-lat" placeholder="-34.6037"></div><div><label>Longitud</label><input id="exp-lng" placeholder="-58.3816"></div></div>' +
    '<div><label>Descripción</label><textarea id="exp-desc" rows="2" placeholder="Descripción de la experiencia"></textarea></div>' +
    '<button class="btn btn-primary" onclick="createExp()">Crear experiencia</button><div class="vinko-msg" id="exp-msg"></div></div>';
}
function spaceForm() {
  return '<div class="vinko-form"><h3 style="font-family:var(--font-display);font-size:.95rem;font-weight:700">Nuevo espacio</h3>' +
    '<div class="row"><div><label>Nombre</label><input id="sp-name" placeholder="Salón comunitario"></div><div><label>Slug</label><input id="sp-slug" placeholder="salon-comunitario"></div></div>' +
    '<div class="row"><div><label>Capacidad</label><input id="sp-cap" type="number" min="1" placeholder="40"></div><div><label>Precio/hora (USD)</label><input id="sp-price" type="number" step="0.01" min="0" placeholder="20.00"></div></div>' +
    '<div><label>Dirección</label><input id="sp-addr" placeholder="Av. Central 123"></div>' +
    '<button class="btn btn-primary" onclick="createSpace()">Crear espacio</button><div class="vinko-msg" id="sp-msg"></div></div>';
}

async function createExp() {
  const msg = document.getElementById('exp-msg');
  msg.className = 'vinko-msg'; msg.textContent = '';
  try {
    const d = await api('/experiences', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: v('exp-name'), slug: v('exp-slug'), base_price: Number(v('exp-price') || 0),
        location_type: v('exp-loc'), location_lat: v('exp-lat') ? Number(v('exp-lat')) : null,
        location_lng: v('exp-lng') ? Number(v('exp-lng')) : null, description: v('exp-desc') || null }) });
    if (d.detail) throw new Error(d.detail);
    msg.className = 'vinko-msg ok'; msg.textContent = 'Experiencia creada ✓';
    setTimeout(load, 600);
  } catch (e) { msg.className = 'vinko-msg err'; msg.textContent = e.message; }
}
async function delExp(id) {
  if (!confirm('¿Archivar esta experiencia?')) return;
  await api('/experiences/' + id, { method: 'DELETE' });
  load();
}
async function createSpace() {
  const msg = document.getElementById('sp-msg');
  msg.className = 'vinko-msg'; msg.textContent = '';
  try {
    const d = await api('/spaces', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: v('sp-name'), slug: v('sp-slug'), capacity: Number(v('sp-cap') || 1),
        price_per_hour: Number(v('sp-price') || 0), address: v('sp-addr'), pricing_model: 'FIXED' }) });
    if (d.detail) throw new Error(d.detail);
    msg.className = 'vinko-msg ok'; msg.textContent = 'Espacio creado ✓';
    setTimeout(load, 600);
  } catch (e) { msg.className = 'vinko-msg err'; msg.textContent = e.message; }
}
async function delSpace(id) {
  if (!confirm('¿Desactivar este espacio?')) return;
  const d = await api('/spaces/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: 'x', slug: 'x', capacity: 1, address: 'x', is_active: false }) });
  load();
}
function v(id) { return (document.getElementById(id) || {}).value || ''; }
load();
</script>
</body>
</html>
