<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><title>Productos</title></head><body class="p-6"><nav class="mb-8"><a href="index.html">← Dashboard</a></nav><main class="max-w-5xl"><h1 class="text-3xl mb-5">Productos</h1><form id="form" class="glass p-4 rounded-xl grid md:grid-cols-4 gap-3"><input name="name" placeholder="Nombre" required><input name="slug" placeholder="slug-producto" required><input name="base_price" type="number" min="0" step=".01" placeholder="Precio" required><select name="status"><option>draft</option><option>active</option></select><button>Crear</button></form><input id="search" class="my-4" placeholder="Buscar"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table></main><script>const h={'Content-Type':'application/json','X-API-Key':localStorage.apiKey||''};async function load(){let r=await fetch('/api/v1/products?search='+encodeURIComponent(search.value));let p=await r.json();rows.innerHTML=p.map(x=>`<tr><td>${x.name}</td><td>${x.product_type}</td><td>${x.currency} ${x.base_price}</td><td>${x.status}</td><td><button onclick="archive('${x.id}')">Archivar</button></td></tr>`).join('')}form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.base_price=Number(d.base_price);d.product_type='custom';d.images=[];d.metadata={};let r=await fetch('/api/v1/products',{method:'POST',headers:h,body:JSON.stringify(d)});if(!r.ok)return alert((await r.json()).detail);form.reset();load()};async function archive(id){await fetch('/api/v1/products/'+id,{method:'DELETE',headers:h});load()}search.oninput=load;load()</script></body></html>
