<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="brand-logo"><svg class="icon"><use href="#i-logo"/></svg></span><div>Multi-Hub<small>Panel de control</small></div></div>
    <nav class="side-links" aria-label="Navegación del panel">
      <p class="nav-sec">Operación</p>
      <a class="side-link" href="index.html"><svg class="icon"><use href="#i-home"/></svg> Resumen</a>
      <a class="side-link" href="products.html"><svg class="icon"><use href="#i-box"/></svg> Productos</a>
      <a class="side-link active" href="orders.html"><svg class="icon"><use href="#i-order"/></svg> Pedidos</a>
      <a class="side-link" href="leads.html"><svg class="icon"><use href="#i-lead"/></svg> Contactos</a>
      <a class="side-link" href="connectors.html"><svg class="icon"><use href="#i-plug"/></svg> Conectores</a>
      <p class="nav-sec">Sitio</p>
      <a class="side-link" href="/" target="_blank"><svg class="icon"><use href="#i-external"/></svg> Ver sitio público</a>
    <div id="user-chip" style="margin-top:1rem"></div>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Pedidos</h1>
      <button class="btn btn-ghost btn-sm" onclick="load()">Actualizar</button>
    </div>
    <div class="toolbar">
      <div class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Buscar por cliente o correo…" oninput="load()"></div>
    </div>
    <div id="list" class="table-wrap"><div class="empty">Cargando…</div></div>
  </main>
</div>

<div class="modal-back" id="modal">
  <div class="modal">
    <h2 id="title">Detalle del pedido</h2>
    <div id="detail"></div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="auth.js"></script>
<script>
'use strict';
if (!requireAuth()) {}
const API = '/api/v1';
let orders = [], products = [];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const statusCls = (s) => ({ pending: 'st-pending', confirmed: 'st-confirmed', cancelled: 'st-cancelled', completed: 'st-completed', paid: 'st-paid', unpaid: 'st-unpaid', refunded: 'st-refunded' }[s] || 'st-draft');
const payCls = (s) => ({ paid: 'st-paid', unpaid: 'st-unpaid', refunded: 'st-refunded' }[s] || 'st-draft');
const fmtUSD = (n, c) => `${c} ${Number(n).toLocaleString('es', { maximumFractionDigits: 2 })}`;
const fmtDate = (s) => s ? new Date(s).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';

function toast(msg, type) { const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg; document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 3500); }
async function get(path) { const r = await authFetch(API + path); if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.detail || 'Error ' + r.status); } return r.json(); }
async function api(path, method, body) { const r = await authFetch(API + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.detail || 'Error ' + r.status); } return r.json().catch(() => ({})); }

async function load() {
  try {
    orders = await get('/orders');
    if (!products.length) products = await get('/products?status=active');
    const prodName = (id) => (products.find((p) => p.id === id) || {}).name || (id || '').slice(0, 8);
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = q ? orders.filter((o) => (o.customer_name + ' ' + o.customer_email).toLowerCase().includes(q)) : orders;
    document.getElementById('list').innerHTML = list.length
      ? `<table><thead><tr><th>Cliente</th><th>Producto</th><th>Fecha</th><th>Cant.</th><th>Total</th><th>Estado</th><th>Pago</th><th></th></tr></thead><tbody>` +
        list.map((o) => `<tr>
          <td><div class="td-name">${esc(o.customer_name)}</div><div class="td-sub">${esc(o.customer_email)}</div></td>
          <td><span class="td-sub">${esc(prodName(o.product_id))}</span></td>
          <td>${fmtDate(o.date_from || o.created_at || '')}</td>
          <td>${o.quantity}</td>
          <td>${fmtUSD(o.total_amount, o.currency)}</td>
          <td><span class="status ${statusCls(o.status)}">${o.status}</span></td>
          <td><span class="status ${payCls(o.payment_status)}">${o.payment_status}</span></td>
          <td><button class="btn btn-ghost btn-sm" onclick="openDetail('${o.id}')">Ver</button></td>
        </tr>`).join('') + '</tbody></table>'
      : '<div class="empty">Sin pedidos</div>';
  } catch (e) { document.getElementById('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function openDetail(id) {
  const o = orders.find((x) => x.id === id);
  if (!o) return;
  document.getElementById('title').textContent = 'Pedido ' + id.slice(0, 8);
  document.getElementById('detail').innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:.6rem 1rem;margin-bottom:1rem">
      <div><div class="td-sub">Cliente</div><div class="td-name">${esc(o.customer_name)}</div></div>
      <div><div class="td-sub">Correo</div><div>${esc(o.customer_email)}</div></div>
      ${o.customer_phone ? `<div><div class="td-sub">Teléfono</div><div>${esc(o.customer_phone)}</div></div>` : ''}
      ${o.date_from ? `<div><div class="td-sub">Fecha</div><div>${esc(o.date_from)}</div><div class="td-sub">${o.date_to ? '→ ' + esc(o.date_to) : ''}</div></div>` : ''}
      <div><div class="td-sub">Cantidad</div><div>${o.quantity}</div></div>
      <div><div class="td-sub">Total</div><div class="td-name">${fmtUSD(o.total_amount, o.currency)}</div></div>
      <div><div class="td-sub">Estado</div><div><span class="status ${statusCls(o.status)}">${o.status}</span></div></div>
      <div><div class="td-sub">Pago</div><div><span class="status ${payCls(o.payment_status)}">${o.payment_status}</span></div></div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr">
      <div class="field"><label>Cambiar estado</label><select id="st-status">
        <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pendiente</option>
        <option value="confirmed" ${o.status === 'confirmed' ? 'selected' : ''}>Confirmado</option>
        <option value="completed" ${o.status === 'completed' ? 'selected' : ''}>Completado</option>
        <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelado</option>
      </select></div>
      <div class="field"><label>Cambiar pago</label><select id="st-pay">
        <option value="unpaid" ${o.payment_status === 'unpaid' ? 'selected' : ''}>No pagado</option>
        <option value="paid" ${o.payment_status === 'paid' ? 'selected' : ''}>Pagado</option>
        <option value="refunded" ${o.payment_status === 'refunded' ? 'selected' : ''}>Reembolsado</option>
      </select></div>
    </div>
    <div class="modal-foot" style="margin-top:1rem">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="saveStatus('${o.id}')">Guardar cambios</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

async function saveStatus(id) {
  const status = document.getElementById('st-status').value;
  const payment_status = document.getElementById('st-pay').value;
  try {
    await api('/orders/' + id, 'PATCH', { status, payment_status });
    toast('Pedido actualizado');
    closeModal(); load();
  } catch (e) { toast(e.message, 'error'); }
}
load();
renderUser();
</script>
</body>
</html>
