<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">

</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V10Z"/></symbol>

  <symbol id="i-lead" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 3v5m0 0v5a3 3 0 0 0 3 3h0M12 8h5a2 2 0 0 1 2 2 5 5 0 0 1-5 5h-2M12 16v5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7V3l-2 2a8 8 0 0 0-13 3m-1 9v4l2-2a8 8 0 0 0 13-3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m1 0v14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6m4 4v6m4-6v6"/></symbol>

</svg>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo"><svg class="icon"><use href="#i-logo"/></svg></span>
      <div>Multi-Hub<small>Panel de control</small></div>
    </div>
    <nav class="side-links" aria-label="Navegación del panel">
      <p class="nav-sec">Operación</p>
      <a class="side-link active" href="index.html"><svg class="icon"><use href="#i-home"/></svg> Resumen</a>
      <a class="side-link" href="products.html"><svg class="icon"><use href="#i-box"/></svg> Productos</a>
      <a class="side-link" href="orders.html"><svg class="icon"><use href="#i-order"/></svg> Pedidos</a>
      <a class="side-link" href="leads.html"><svg class="icon"><use href="#i-lead"/></svg> Contactos</a>
      <a class="side-link" href="connectors.html"><svg class="icon"><use href="#i-plug"/></svg> Conectores</a>
      <p class="nav-sec">Sitio</p>
      <a class="side-link" href="/" target="_blank"><svg class="icon"><use href="#i-external"/></svg> Ver sitio público</a>
    <div id="user-chip" style="margin-top:1rem"></div>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Resumen</h1>
      <div class="topbar-actions">
        <span id="last-refresh" class="muted"></span>
        <button class="btn btn-ghost btn-sm" onclick="reload()"><svg class="icon"><use href="#i-refresh"/></svg> Actualizar</button>
      </div>
    </div>

    <div id="stats" class="grid grid-3"></div>

    <div class="grid grid-2 mt">
      <section class="card">
        <h3>Distribución por tipo</h3>
        <div id="types-bars" class="bars"><div class="empty"><svg class="icon"><use href="#i-box"/></svg>Cargando…</div></div>
      </section>
      <section class="card">
        <h3>Ventas por día</h3>
        <div id="sales-bars" class="bars"><div class="empty"><svg class="icon"><use href="#i-order"/></svg>Cargando…</div></div>
      </section>
    </div>

    <div class="grid grid-2 mt">
      <section class="card">
        <div class="flex-between">
          <h3>Últimos pedidos</h3>
          <a class="btn btn-ghost btn-sm" href="orders.html">Ver todos</a>
        </div>
        <div id="recent-orders"><div class="empty"><svg class="icon"><use href="#i-order"/></svg>Cargando…</div></div>
      </section>
      <section class="card">
        <div class="flex-between">
          <h3>Contactos recientes</h3>
          <a class="btn btn-ghost btn-sm" href="leads.html">Ver todos</a>
        </div>
        <div id="recent-leads"><div class="empty"><svg class="icon"><use href="#i-lead"/></svg>Cargando…</div></div>
      </section>
    </div>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>

<script src="auth.js"></script>
<script>
'use strict';
if (!requireAuth()) {}
const API = '/api/v1';
const fmtUSD = (n, c = 'USD') => `${c} ${Number(n).toLocaleString('es', { maximumFractionDigits: 2 })}`;
const fmtDate = (s) => s ? new Date(s).toLocaleDateString('es', { day: '2-digit', month: 'short' }) : '—';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const TYPE_LABEL = { hotel: 'Hotel', tour: 'Tour', restaurant: 'Restaurante', event: 'Evento', service: 'Servicio', custom: 'Experiencia' };

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'ok' ? '' : ' ' + type);
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
const statusCls = (s) => ({ active: 'st-active', draft: 'st-draft', pending: 'st-pending', confirmed: 'st-confirmed', cancelled: 'st-cancelled', completed: 'st-completed', unpaid: 'st-unpaid', paid: 'st-paid', refunded: 'st-refunded', new: 'st-new', disabled: 'st-disabled', error: 'st-error' }[s] || 'st-draft');

async function get(path, opts) {
  const r = await authFetch(API + path, opts);
  if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.detail || 'Error ' + r.status); }
  return r.json();
}

const TYPES = { hotel: 'Hoteles', tour: 'Tours', restaurant: 'Restaurantes', event: 'Eventos', service: 'Servicios', custom: 'Experiencias' };
const TYPE_EMOJI = { hotel: '🏨', tour: '🧭', restaurant: '🍽️', event: '🎭', service: '✨', custom: '🌟' };

function renderTypesBars(data) {
  const total = data.reduce((a, b) => a + b.count, 0) || 1;
  document.getElementById('types-bars').innerHTML = data.map((x) => {
    const pct = Math.round((x.count / total) * 100);
    return `<div class="bar-row">
      <span>${TYPE_EMOJI[x.type] || '▪'} ${TYPE_LABEL[x.type] || x.type}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;animation-delay:${Math.random() * .2}s"></div></div>
      <span>${x.count}</span>
    </div>`;
  }).join('') || '<div class="empty">Sin productos</div>';
}

function renderSalesBars(days) {
  if (!days || !days.length) { document.getElementById('sales-bars').innerHTML = '<div class="empty"><svg class="icon"><use href="#i-order"/></svg>Sin ventas confirmadas aún</div>'; return; }
  const max = Math.max(...days.map((d) => d.sales)) || 1;
  document.getElementById('sales-bars').innerHTML = days.slice(-10).map((d) => {
    const pct = Math.max(4, Math.round((d.sales / max) * 100));
    return `<div class="bar-row">
      <span>${esc(d.date)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span>$${Number(d.sales).toLocaleString('es', { maximumFractionDigits: 0 })}</span>
    </div>`;
  }).join('');
}

async function load() {
  try {
    const [stats, charts, orders, leads] = await Promise.all([
      get('/dashboard/stats'), get('/dashboard/charts'), get('/orders'), get('/leads')
    ]);

    const salesPct = stats.sales > 0 ? { trend: 'Ventas confirmadas', cls: 'trend-up' } : { trend: 'Sin ventas aún', cls: 'trend-flat' };
    const statsHTML = [
      { label: 'Productos activos', num: stats.active_products, icon: 'i-box', trend: 'En catálogo', cls: 'trend-flat' },
      { label: 'Pedidos hoy', num: stats.orders_today, icon: 'i-order', trend: orders_today => orders_today > 0 ? 'Hay actividad hoy' : 'Sin pedidos hoy', cls: stats.orders_today > 0 ? 'trend-up' : 'trend-flat' },
      { label: 'Ventas confirmadas', num: '$' + Number(stats.sales).toLocaleString('es', { maximumFractionDigits: 0 }), icon: 'i-lead', trend: salesPct.trend, cls: salesPct.cls }
    ].map((s) => `<div class="card">
      <div class="flex" style="gap:.5rem;margin-bottom:.4rem"><svg class="icon"><use href="#${s.icon}"/></svg><span class="stat-label">${s.label}</span></div>
      <div class="stat-num">${s.num}</div>
      <div class="${s.cls}">${typeof s.trend === 'function' ? s.trend(stats.orders_today) : s.trend}</div>
    </div>`).join('');
    document.getElementById('stats').innerHTML = statsHTML;

    renderTypesBars(charts.products_by_type || []);
    renderSalesBars(charts.daily_sales || []);

    const recent = (orders || []).slice(0, 5);
    document.getElementById('recent-orders').innerHTML = recent.length
      ? '<table><thead><tr><th>Cliente</th><th>Producto</th><th>Total</th><th>Estado</th></tr></thead><tbody>' +
        recent.map((o) => `<tr><td class="td-name">${esc(o.customer_name)}</td><td><span class="td-sub">${esc((o.product_id || '').slice(0, 8))}</span></td><td>${fmtUSD(o.total_amount, o.currency)}</td><td><span class="status ${statusCls(o.status)}">${o.status}</span></td></tr>`).join('') +
        '</tbody></table>'
      : '<div class="empty"><svg class="icon"><use href="#i-order"/></svg>Sin pedidos registrados</div>';

    const leadsRecent = (leads || []).slice(0, 5);
    document.getElementById('recent-leads').innerHTML = leadsRecent.length
      ? leadsRecent.map((l) => `<div class="flex-between" style="padding:.7rem 0;border-bottom:1px solid var(--border)"><div><div class="td-name">${esc(l.name)}</div><div class="td-sub">${esc(l.email || '')}${l.business_name ? ' · ' + esc(l.business_name) : ''}</div></div><span class="status ${statusCls(l.status)}">${l.status}</span></div>`).join('')
      : '<div class="empty"><svg class="icon"><use href="#i-lead"/></svg>Sin contactos aún</div>';

    document.getElementById('last-refresh').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es');
  } catch (e) {
    document.getElementById('stats').innerHTML = `<div class="card"><div class="empty"><svg class="icon"><use href="#i-lead"/></svg>${esc(e.message)}</div></div>`;
    toast(e.message, 'error');
  }
}
function reload() { load(); }
load();
renderUser();
</script>
</body>
</html>
