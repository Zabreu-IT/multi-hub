<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><title>Multi-Hub Admin</title></head><body class="p-6"><nav class="mb-8 flex gap-5"><b>◇ Multi-Hub</b><a href="products.html">Productos</a><a href="connectors.html">Conectores</a></nav><main class="max-w-5xl"><h1 class="text-3xl font-bold mb-6">Dashboard</h1><section id="stats" class="grid md:grid-cols-3 gap-4"></section><section class="glass p-5 rounded-xl mt-6"><h2 class="text-xl mb-3">Ventas diarias</h2><pre id="chart"></pre></section></main><script>const h={'X-API-Key':localStorage.apiKey||''};Promise.all([fetch('/api/v1/dashboard/stats',{headers:h}),fetch('/api/v1/dashboard/charts',{headers:h})]).then(async r=>[await r[0].json(),await r[1].json()]).then(([s,c])=>{stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="glass p-5 rounded-xl"><small>${k.replace('_',' ')}</small><strong class="block text-3xl">${v}</strong></div>`).join('');chart.textContent=c.daily_sales.map(x=>`${x.date}  $${x.sales}`).join('\n')||'Sin ventas aún';}).catch(()=>stats.innerHTML='Configure API_KEY en localStorage.apiKey si está habilitada.');</script></body></html>
