  <main class="main">
    <div class="topbar">
      <h1>Contactos</h1>
      <span class="muted">Solicitudes de negocios que quieren vender en Multi-Hub</span>

<div id="toasts" aria-live="polite"></div>

<script src="auth.js"></script>
<script>
'use strict';
if (!requireAuth()) {}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const statusCls = (s) => ({ new: 'st-new', contacted: 'st-confirmed', qualified: 'st-active', lost: 'st-cancelled' }[s] || 'st-new');
const fmtDate = (s) => s ? new Date(s).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const BTYPE = { hotel: 'Hotel', restaurant: 'Restaurante', tour: 'Tour', spa: 'Spa', transport: 'Transporte', event: 'Evento', other: 'Otro' };
function toast(msg, type) { const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg; document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 3500); }

async function load() {
  try {
    const r = await authFetch('/api/v1/leads');
    if (!r.ok) throw new Error((await r.json()).detail || 'Error ' + r.status);
    const leads = await r.json();
    document.getElementById('list').innerHTML = leads.length
      ? `<table><thead><tr><th>Nombre</th><th>Negocio</th><th>Tipo</th><th>Contacto</th><th>Mensaje</th><th>Estado</th><th>Recibido</th></tr></thead><tbody>` +
        leads.map((l) => `<tr>
          <td class="td-name">${esc(l.name)}</td>
          <td>${esc(l.business_name || '—')}</td>
          <td><span class="td-sub">${BTYPE[l.business_type] || esc(l.business_type || '—')}</span></td>
          <td><div>${esc(l.email || '')}</div><div class="td-sub">${esc(l.phone || '')}</div></td>
          <td><span class="td-sub">${esc((l.message || '').slice(0, 60))}${(l.message || '').length > 60 ? '…' : ''}</span></td>
          <td><span class="status ${statusCls(l.status)}">${l.status}</span></td>
          <td><span class="td-sub">${fmtDate(l.created_at)}</span></td>
        </tr>`).join('') + '</tbody></table>'
      : '<div class="empty">Sin contactos aún</div>';
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
load();
renderUser();
</script>
</body>
