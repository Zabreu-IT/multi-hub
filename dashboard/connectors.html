<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><title>Conectores</title></head><body class="p-6"><nav class="mb-8"><a href="index.html">← Dashboard</a></nav><main class="max-w-5xl"><h1 class="text-3xl mb-5">Conectores</h1><form id="form" class="glass p-4 rounded-xl flex gap-3"><input name="name" placeholder="Nombre" required><select name="platform"><option>native</option><option>shopify</option><option>woocommerce</option><option>prestashop</option></select><button>Agregar</button></form><div id="list" class="grid md:grid-cols-3 gap-4 mt-5"></div></main><script>const h={'Content-Type':'application/json','X-API-Key':localStorage.apiKey||''};async function load(){let a=await (await fetch('/api/v1/connectors',{headers:h})).json();list.innerHTML=a.map(x=>`<article class="glass p-4 rounded-xl"><b>${x.name}</b><p>${x.platform} · ${x.status}</p><button onclick="sync('${x.id}')">Sync</button></article>`).join('')}form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.config={};let r=await fetch('/api/v1/connectors',{method:'POST',headers:h,body:JSON.stringify(d)});if(!r.ok)return alert((await r.json()).detail);load()};async function sync(id){alert(JSON.stringify(await (await fetch('/api/v1/connectors/'+id+'/sync',{method:'POST',headers:h})).json()))}load()</script></body></html>
